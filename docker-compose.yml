services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas_subscriptions
    ports:
      - '5433:5432' # host 5433 to avoid clashing with a locally installed Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas -d saas_subscriptions']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '8025:8025' # web UI — open http://localhost:8025 to see emails the backend sends
      - '1025:1025' # SMTP

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://saas:saas@postgres:5432/saas_subscriptions?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN_SECONDS: '28800'
      USAGE_ALERT_THRESHOLD: '0.8'
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      MAIL_FROM: alerts@saas-subscriptions.test
    ports:
      - '3001:3001'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api/v1
        VITE_WS_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  pgdata:
